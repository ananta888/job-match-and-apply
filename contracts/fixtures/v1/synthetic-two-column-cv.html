<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Synthetic Two-Column CV</title>
  <style>
    body { color: #222222; background: #ffffff; }
    h2 { color: #7c3aed; }
    .sidebar { background: #0f172a; width: 30%; float: left; color: #f9fafb; }
    .main { margin-left: 34%; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <h2>Profil</h2>
    <p>Synthetic Candidate</p>
    <h2>Kenntnisse</h2>
    <ul><li>TypeScript</li></ul>
    <h2>Sprachen</h2>
    <p>Deutsch</p>
  </aside>
  <main class="main">
    <h2>Berufserfahrung</h2>
    <p>Software Engineer</p>
    <h2>Ausbildung</h2>
    <p>Synthetic University</p>
  </main>
</body>
</html>
